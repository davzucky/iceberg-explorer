name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch or SHA) used to create the release tag"
        required: false
        default: "main"

jobs:
  create-tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      - name: Create and push release tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Resolve release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PYPROJECT_VERSION=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag version ($VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi

          IFS='.' read -r major minor patch <<EOF
          $VERSION
          EOF
          NEXT_VERSION="$major.$minor.$((patch + 1))"
          OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/${OWNER_LOWER}/iceberg-explorer"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "image_repo=$IMAGE_REPO" >> "$GITHUB_OUTPUT"

      - name: Build release wheel
        run: uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image locally
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}" \
            -t "${{ steps.meta.outputs.image_repo }}:sha-${GITHUB_SHA::7}" \
            -t "${{ steps.meta.outputs.image_repo }}:latest" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker image tags to GHCR
        run: |
          docker push "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image_repo }}:sha-${GITHUB_SHA::7}"
          docker push "${{ steps.meta.outputs.image_repo }}:latest"

      - name: Publish wheel to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create GitHub Release with generated notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.whl

      - name: Bump to next patch version
        env:
          NEXT_VERSION: ${{ steps.meta.outputs.next_version }}
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          next_version = __import__("os").environ["NEXT_VERSION"]

          pyproject_path = Path("pyproject.toml")
          pyproject_text = pyproject_path.read_text(encoding="utf-8")
          pyproject_text = re.sub(
              r'(?m)^version = ".*"$',
              f'version = "{next_version}"',
              pyproject_text,
              count=1,
          )
          pyproject_path.write_text(pyproject_text, encoding="utf-8")

          init_path = Path("src/iceberg_explorer/__init__.py")
          init_text = init_path.read_text(encoding="utf-8")
          init_text = re.sub(
              r'(?m)^__version__ = ".*"$',
              f'__version__ = "{next_version}"',
              init_text,
              count=1,
          )
          init_path.write_text(init_text, encoding="utf-8")
          PY

      - name: Open post-release version bump PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: bump version to ${{ steps.meta.outputs.next_version }}"
          title: "chore: bump version to ${{ steps.meta.outputs.next_version }}"
          body: |
            Automated post-release patch bump.

            - Released version: ${{ steps.meta.outputs.version }}
            - New development version: ${{ steps.meta.outputs.next_version }}
          branch: chore/release-bump-v${{ steps.meta.outputs.next_version }}
          base: main
